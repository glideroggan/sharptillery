    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['line', 'scatter', 'corechart', 'table']});
        google.charts.setOnLoadCallback(drawAll);

        const groupBy = function (xs, key) {
            return xs.reduce(function (rv, x) {
                (rv[x[key]] = rv[x[key]] || []).push(x);
                return rv;
            }, {});
        };

        function drawSummaryTable() {
            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Metric');
            data.addColumn('string', 'Value');

            const s = JSON.parse(document.getElementById('summary').textContent);
            const pct = (x) => (x * 100).toFixed(2) + '%';
            const ms = (x) => (x).toFixed(2) + ' ms';

            data.addRows([
                ['Endpoint', String(s.endpoint)],
                ['Duration', (s.durationSeconds).toFixed(2) + ' s'],
                ['Requests', String(s.requests)],
                ['OK', String(s.ok)],
                ['Errors', String(s.errors)],
                ['Error ratio', pct(s.errorRatio)],
                ['Average RPS', (s.averageRps).toFixed(1)],
                ['Mean latency', ms(s.meanLatencyMs)],
                ['Max latency', ms(s.maxLatencyMs)],
                ['p50 latency', ms(s.p50LatencyMs)],
                ['p90 latency', ms(s.p90LatencyMs)],
                ['p95 latency', ms(s.p95LatencyMs)],
                ['p99 latency', ms(s.p99LatencyMs)]
            ]);

            var table = new google.visualization.Table(document.getElementById('summary_div'));
            table.draw(data, {showRowNumber: false, width: '60%', height: '100%'});
        }

        function drawPhaseTable() {
            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Phase');
            data.addColumn('number', 'Mean latency (ms)');
            data.addColumn('number', 'Mean RPS');
            data.addColumn('number', 'Error ratio');

            let dataRows = JSON.parse(document.getElementById('data').textContent);
            let groupedByPhase = groupBy(dataRows, 'phase');

            const avg = (arr, key) => arr.reduce((p, c) => p + c[key], 0) / arr.length;
            let rows = [];
            for (const phase in groupedByPhase) {
                const items = groupedByPhase[phase];
                rows.push([
                    phase,
                    avg(items, 'meanLatencyMs'),
                    avg(items, 'rps'),
                    avg(items, 'errorRatio')
                ]);
            }

            data.addRows(rows);
            var table = new google.visualization.Table(document.getElementById('phase_div'));
            table.draw(data, {showRowNumber: false, width: '60%', height: '100%'});
        }
        
        function drawMainChart() {
            let data = new google.visualization.DataTable();
            data.addColumn('number', 'Time');
            data.addColumn('number', 'Mean latency (ms)');
            data.addColumn('number', 'RPS');
            data.addColumn('number', 'Error ratio');

            let rows = JSON.parse(document.getElementById('data').textContent);
            // check settings if a specific phase should not be included in the main graph
            // const settings = JSON.parse(document.getElementById('settings').textContent);
            // const phases = settings['phases'].map(r => {
            //     return {phaseName:r['name'], excludedGraph: r['excludeGraph']} 
            // });
            // let validRows = rows.filter(row => {
            //     let phase = phases.find(e => e.phaseName === row['phase']);
            //     return phase.excludedGraph === false;
            // });
                
            data.addRows(rows.map(o => {
                return [o['time'], o['meanLatencyMs'], o['rps'], o['errorRatio']]
            }));

            const maxErrorRatio = rows.reduce((p, c) => Math.max(p, c['errorRatio'] ?? 0), 0);
            const errorAxisMax = Math.max(0.02, maxErrorRatio * 1.2);
            const errorAxisMin = -errorAxisMax * 0.1;

            let chartDiv = document.getElementById('linechart_material')

            var options = {
                title: 'Latency, RPS, and errors over time',
                subtitle: '<# ENDPOINT #>',
                width: 1600,
                height: 500,
                chartArea: {
                    left: 90,
                    right: 120,
                    top: 70,
                    bottom: 60
                },
                seriesType: 'line',
                series: {
                    0: { targetAxisIndex: 0 },
                    1: { targetAxisIndex: 1, type: 'bars' },
                    2: { targetAxisIndex: 2, lineWidth: 3, pointSize: 4 }
                },
                vAxes: {
                    0: { title: 'Latency (ms)' },
                    1: { title: 'RPS' },
                    2: {
                        title: '',
                        format: 'percent',
                        viewWindow: { min: errorAxisMin, max: errorAxisMax },
                        textPosition: 'in',
                        gridlines: { color: 'transparent' }
                    }
                }
            };

            const materialChart = new google.visualization.ComboChart(chartDiv);
            materialChart.draw(data, options);
        }
        
        function drawAll() {
            drawMainChart();
            drawSummaryTable();
            drawPhaseTable();
        }
    </script>
</head>
<body>
    <div id="linechart_material"></div>
    <div id="summary_div"></div>
    <div id="phase_div"></div>
</body>
</html>
