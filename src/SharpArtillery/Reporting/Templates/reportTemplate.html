<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Test Report</title>
    <script id="data" type="application/json">
        <# PUT DATA HERE #>
    </script>
    <script id="summary" type="application/json">
        <# PUT SUMMARY HERE #>
    </script>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        /* Phase 2.1: Responsive Container Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            padding: 24px;
            color: #1e293b;
            line-height: 1.5;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        .section {
            margin-bottom: 48px;
        }
        
        /* Phase 2.5: Section Titles */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .chart-wrapper {
            width: 100%;
            overflow-x: auto;
        }
        
        /* Phase 2.4: Two-Column Layout */
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }
        
        @media (max-width: 1024px) {
            .two-column { grid-template-columns: 1fr; }
            .container { padding: 24px; }
        }
        
        @media (max-width: 768px) {
            body { padding: 12px; }
            .section-title { font-size: 16px; }
        }
        
        /* Phase 2.3: Report Header */
        .report-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }
        
        .report-header .endpoint {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 24px;
            font-family: "SF Mono", "Fira Code", Consolas, monospace;
            word-break: break-all;
        }
        
        .report-meta {
            display: flex;
            gap: 32px;
            padding: 16px 24px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 32px;
            font-size: 14px;
            color: #475569;
            flex-wrap: wrap;
        }
        
        .report-meta strong {
            color: #1e293b;
        }
        
        @media (max-width: 768px) {
            .report-meta { flex-direction: column; gap: 8px; }
        }
        
        /* Phase 2.2: KPI Summary Cards */
        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .kpi-card {
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }
        
        /* Phase 3.1: Custom Color Palette */
        .kpi-rps { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .kpi-latency { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .kpi-errors { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .kpi-requests { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
        
        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: "SF Mono", "Fira Code", Consolas, monospace;
        }
        
        .kpi-label {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Phase 1.1: Empty Error State */
        .empty-state {
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-radius: 12px;
            border: 2px dashed #86efac;
        }
        
        .empty-state-content {
            text-align: center;
        }
        
        .empty-state h3 {
            color: #166534;
            margin: 16px 0 8px;
            font-size: 20px;
            font-weight: 600;
        }
        
        .empty-state p {
            color: #4ade80;
            margin: 0;
            font-size: 14px;
        }
        
        /* Phase 3.2: Improved Table Styling */
        .google-visualization-table-table {
            font-family: inherit !important;
            border-collapse: collapse !important;
            width: 100% !important;
        }
        
        .google-visualization-table-table th {
            background: #f8fafc !important;
            color: #475569 !important;
            font-weight: 600 !important;
            text-transform: uppercase !important;
            font-size: 12px !important;
            letter-spacing: 0.5px !important;
            padding: 12px 16px !important;
            border-bottom: 2px solid #e2e8f0 !important;
        }
        
        .google-visualization-table-table td {
            padding: 12px 16px !important;
            border-bottom: 1px solid #f1f5f9 !important;
            font-size: 14px !important;
        }
        
        .google-visualization-table-table tr:hover td {
            background: #f8fafc !important;
        }
        
        /* Keyboard focus styles */
        .google-visualization-table-table th:focus,
        .google-visualization-table-table td:focus {
            outline: 2px solid #8b5cf6;
            outline-offset: -2px;
        }
        
        /* Phase 3.3: Print Stylesheet */
        @media print {
            body { 
                background: white; 
                padding: 0; 
            }
            
            .container { 
                box-shadow: none; 
                padding: 20px; 
            }
            
            .kpi-card {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            .chart-wrapper {
                page-break-inside: avoid;
            }
            
            .section {
                page-break-inside: avoid;
            }
        }
    </style>
    <script type="text/javascript">
        // Phase 3.1: Custom Color Palette
        const CHART_COLORS = {
            latency: '#8b5cf6',    // Purple - primary metric
            rps: '#06b6d4',        // Cyan - throughput
            error: '#ef4444',      // Red - errors
            success: '#10b981',    // Green - success
            warning: '#f59e0b',    // Amber - warnings
            neutral: '#64748b'     // Slate - secondary
        };

        google.charts.load('current', {'packages':['line', 'scatter', 'corechart', 'table']});
        google.charts.setOnLoadCallback(drawAll);

        const groupBy = function (xs, key) {
            return xs.reduce(function (rv, x) {
                (rv[x[key]] = rv[x[key]] || []).push(x);
                return rv;
            }, {});
        };

        // Phase 2.3: Report Header with Metadata
        function drawReportMeta() {
            const s = JSON.parse(document.getElementById('summary').textContent);
            document.getElementById('report-endpoint').textContent = s.endpoint || '-';
            document.getElementById('report-timestamp').textContent = new Date().toLocaleString();
            document.getElementById('report-duration').textContent = s.durationSeconds.toFixed(1) + 's';
        }

        // Phase 2.2: KPI Summary Cards
        function drawSummaryCards() {
            const s = JSON.parse(document.getElementById('summary').textContent);
            document.getElementById('kpi-rps').textContent = s.averageRps.toFixed(1);
            document.getElementById('kpi-p95').textContent = s.p95LatencyMs.toFixed(1) + ' ms';
            document.getElementById('kpi-errors').textContent = (s.errorRatio * 100).toFixed(2) + '%';
            document.getElementById('kpi-requests').textContent = s.requests.toLocaleString();
        }

        function drawSummaryTable() {
            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Metric');
            data.addColumn('string', 'Value');

            const s = JSON.parse(document.getElementById('summary').textContent);
            const pct = (x) => (x * 100).toFixed(2) + '%';
            const ms = (x) => (x).toFixed(2) + ' ms';

            data.addRows([
                ['Endpoint', String(s.endpoint)],
                ['Duration', (s.durationSeconds).toFixed(2) + ' s'],
                ['Requests', String(s.requests)],
                ['OK', String(s.ok)],
                ['Errors', String(s.errors)],
                ['Error ratio', pct(s.errorRatio)],
                ['Timeouts', String(s.timeouts)],
                ['2xx', String(s.status2xx)],
                ['3xx', String(s.status3xx)],
                ['4xx', String(s.status4xx)],
                ['5xx', String(s.status5xx)],
                ['Responses w/ length', String(s.knownResponseLengthCount)],
                ['Mean response length', (s.meanResponseLengthBytes).toFixed(0) + ' bytes'],
                ['Max response length', (s.maxResponseLengthBytes).toFixed(0) + ' bytes'],
                ['Average RPS', (s.averageRps).toFixed(1)],
                ['Mean latency', ms(s.meanLatencyMs)],
                ['Max latency', ms(s.maxLatencyMs)],
                ['p50 latency', ms(s.p50LatencyMs)],
                ['p90 latency', ms(s.p90LatencyMs)],
                ['p95 latency', ms(s.p95LatencyMs)],
                ['p99 latency', ms(s.p99LatencyMs)]
            ]);

            var table = new google.visualization.Table(document.getElementById('summary_div'));
            table.draw(data, {showRowNumber: false, width: '100%', height: '100%'});
        }

        function drawPhaseTable() {
            const s = JSON.parse(document.getElementById('summary').textContent);
            const phases = s.phaseBreakdown ?? [];
            
            // If no phase data, fall back to time-series grouping
            if (phases.length === 0) {
                drawPhaseTableFromTimeSeries();
                return;
            }
            
            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Phase');
            data.addColumn('number', 'Requests');
            data.addColumn('number', 'Duration (s)');
            data.addColumn('number', 'Avg RPS');
            data.addColumn('number', 'Mean Latency (ms)');
            data.addColumn('number', 'p50 (ms)');
            data.addColumn('number', 'p95 (ms)');
            data.addColumn('number', 'p99 (ms)');
            data.addColumn('number', 'Error %');

            const pct = (x) => (x * 100);
            
            data.addRows(phases.map(p => [
                p.phase,
                p.requests,
                Math.round(p.durationSeconds * 10) / 10,
                Math.round(p.averageRps),
                Math.round(p.meanLatencyMs * 100) / 100,
                Math.round(p.p50LatencyMs * 100) / 100,
                Math.round(p.p95LatencyMs * 100) / 100,
                Math.round(p.p99LatencyMs * 100) / 100,
                Math.round(pct(p.errorRatio) * 100) / 100
            ]));

            var table = new google.visualization.Table(document.getElementById('phase_div'));
            table.draw(data, {showRowNumber: false, width: '100%', height: '100%'});
        }
        
        function drawPhaseTableFromTimeSeries() {
            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Phase');
            data.addColumn('number', 'Mean latency (ms)');
            data.addColumn('number', 'Mean RPS');
            data.addColumn('number', 'Error ratio');

            let dataRows = JSON.parse(document.getElementById('data').textContent);
            let groupedByPhase = groupBy(dataRows, 'phase');

            const avg = (arr, key) => arr.reduce((p, c) => p + c[key], 0) / arr.length;
            let rows = [];
            for (const phase in groupedByPhase) {
                const items = groupedByPhase[phase];
                rows.push([
                    phase,
                    avg(items, 'meanLatencyMs'),
                    avg(items, 'rps'),
                    avg(items, 'errorRatio')
                ]);
            }

            data.addRows(rows);
            var table = new google.visualization.Table(document.getElementById('phase_div'));
            table.draw(data, {showRowNumber: false, width: '100%', height: '100%'});
        }

        function drawStatusHistogramTable() {
            const s = JSON.parse(document.getElementById('summary').textContent);
            const items = s.statusHistogram ?? [];

            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Status');
            data.addColumn('number', 'Count');
            data.addColumn({ type: 'string', role: 'tooltip' });

            data.addRows(items.map(o => {
                const status = String(o.statusCode);
                const count = Number(o.count);
                const ratio = Number(o.ratio);
                const tooltip = `${status}: ${count} (${(ratio * 100).toFixed(2)}%)`;
                return [status, count, tooltip];
            }));

            const options = {
                title: 'Status code distribution',
                width: '100%',
                height: 320,
                legend: { position: 'none' },
                chartArea: { left: 60, right: 20, top: 50, bottom: 60 },
                hAxis: { title: 'HTTP status' },
                vAxis: { title: 'Count', minValue: 0 },
                colors: [CHART_COLORS.success]
            };

            const chart = new google.visualization.ColumnChart(document.getElementById('status_div'));
            chart.draw(data, options);
        }

        // Phase 1.1: Empty Error Chart State Handler
        function drawErrorHistogramTable() {
            const s = JSON.parse(document.getElementById('summary').textContent);
            const items = s.errorHistogram ?? [];

            // Handle empty state with friendly message
            if (items.length === 0) {
                const emptyDiv = document.getElementById('error_div');
                emptyDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-content">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <h3>No Errors Detected</h3>
                            <p>All ${s.requests} requests completed successfully</p>
                        </div>
                    </div>
                `;
                return;
            }

            // Keep the chart readable by limiting to the top N error groups.
            const topN = 12;
            const topItems = items.slice(0, topN);

            let data = new google.visualization.DataTable();
            data.addColumn('string', 'Error');
            data.addColumn('number', 'Count');
            data.addColumn({ type: 'string', role: 'tooltip' });

            data.addRows(topItems.map(o => {
                const label = String(o.error);
                const count = Number(o.count);
                const ratio = Number(o.ratio);
                const tooltip = `${label}: ${count} (${(ratio * 100).toFixed(2)}% of errors)`;
                return [label, count, tooltip];
            }));

            const options = {
                title: 'Top error types',
                width: '100%',
                height: 420,
                legend: { position: 'none' },
                chartArea: { left: 320, right: 20, top: 50, bottom: 30 },
                hAxis: { title: 'Count', minValue: 0 },
                vAxis: { title: '' },
                colors: [CHART_COLORS.error]
            };

            const chart = new google.visualization.BarChart(document.getElementById('error_div'));
            chart.draw(data, options);
        }
        
        function drawMainChart() {
            let data = new google.visualization.DataTable();
            data.addColumn('number', 'Time');
            data.addColumn('number', 'Mean latency (ms)');
            data.addColumn('number', 'RPS');
            data.addColumn('number', 'Error ratio');

            let rows = JSON.parse(document.getElementById('data').textContent);
                
            data.addRows(rows.map(o => {
                return [o['time'], o['meanLatencyMs'], o['rps'], o['errorRatio']]
            }));

            const maxErrorRatio = rows.reduce((p, c) => Math.max(p, c['errorRatio'] ?? 0), 0);
            const errorAxisMax = Math.max(0.02, maxErrorRatio * 1.2);
            const errorAxisMin = -errorAxisMax * 0.1;

            const maxTime = rows.reduce((p, c) => Math.max(p, c['time'] ?? 0), 0);
            const timeAxisMax = Math.max(1, maxTime);

            // Phase 1.2: P95-based latency axis scaling
            const allLatencies = rows.map(r => r['meanLatencyMs']).filter(l => l > 0).sort((a,b) => a-b);
            const p95Latency = allLatencies.length > 0 
                ? allLatencies[Math.floor(allLatencies.length * 0.95)]
                : 100;
            const latencyAxisMax = Math.ceil(p95Latency * 1.5); // 50% headroom above p95

            let chartDiv = document.getElementById('linechart_material')

            // Phase 1.3 & 1.4: Reduce gridline density and fix axis crowding
            var options = {
                title: 'Latency, RPS, and errors over time',
                subtitle: '<# ENDPOINT #>',
                width: '100%',
                height: 500,
                chartArea: {
                    left: 90,
                    right: 90,  // Increased for error % axis
                    top: 70,
                    bottom: 60
                },
                seriesType: 'line',
                series: {
                    0: { targetAxisIndex: 0, color: CHART_COLORS.latency },
                    1: { targetAxisIndex: 1, type: 'bars', color: CHART_COLORS.rps },
                    2: { targetAxisIndex: 2, lineWidth: 3, pointSize: 4, color: CHART_COLORS.error }
                },
                hAxis: {
                    title: 'Time (s)',
                    viewWindow: { min: 0, max: timeAxisMax },
                    gridlines: { count: Math.min(10, Math.ceil(timeAxisMax / 5)) }  // Phase 1.3
                },
                vAxes: {
                    0: { 
                        title: 'Latency (ms)',
                        viewWindow: { min: 0, max: latencyAxisMax },  // Phase 1.2
                        gridlines: { count: 5 }  // Phase 1.3
                    },
                    1: { 
                        title: 'RPS',
                        gridlines: { color: 'transparent' }  // Phase 1.3
                    },
                    2: {
                        title: 'Error %',  // Phase 1.4
                        format: 'percent',
                        viewWindow: { min: errorAxisMin, max: errorAxisMax },
                        textPosition: 'out',  // Phase 1.4: Changed from 'in'
                        textStyle: { fontSize: 11 },
                        gridlines: { color: 'transparent' }
                    }
                }
            };

            const materialChart = new google.visualization.ComboChart(chartDiv);
            materialChart.draw(data, options);
        }
        
        function drawAll() {
            drawReportMeta();
            drawSummaryCards();
            drawMainChart();
            drawSummaryTable();
            drawPhaseTable();
            drawStatusHistogramTable();
            drawErrorHistogramTable();
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Phase 2.3: Report Header -->
        <div class="report-header">
            <h1>Load Test Report</h1>
            <p class="endpoint" id="report-endpoint">-</p>
        </div>
        
        <div class="report-meta">
            <div><strong>Generated:</strong> <span id="report-timestamp">-</span></div>
            <div><strong>Duration:</strong> <span id="report-duration">-</span></div>
            <div><strong>Tool:</strong> Sharptillery</div>
        </div>
        
        <!-- Phase 2.2: KPI Cards -->
        <div class="kpi-cards">
            <div class="kpi-card kpi-rps">
                <div class="kpi-value" id="kpi-rps">-</div>
                <div class="kpi-label">Avg RPS</div>
            </div>
            <div class="kpi-card kpi-latency">
                <div class="kpi-value" id="kpi-p95">-</div>
                <div class="kpi-label">p95 Latency</div>
            </div>
            <div class="kpi-card kpi-errors">
                <div class="kpi-value" id="kpi-errors">-</div>
                <div class="kpi-label">Error Rate</div>
            </div>
            <div class="kpi-card kpi-requests">
                <div class="kpi-value" id="kpi-requests">-</div>
                <div class="kpi-label">Total Requests</div>
            </div>
        </div>
        
        <!-- Phase 2.5: Section with Title -->
        <div class="section">
            <h2 class="section-title">Performance Over Time</h2>
            <div class="chart-wrapper">
                <div id="linechart_material" role="img" aria-label="Time series chart showing mean latency, requests per second, and error rate over the test duration"></div>
            </div>
        </div>
        
        <!-- Phase 2.4: Two-Column Layout -->
        <div class="section two-column">
            <div>
                <h2 class="section-title">Summary Statistics</h2>
                <div id="summary_div"></div>
            </div>
            <div>
                <h2 class="section-title">Phase Breakdown</h2>
                <div id="phase_div"></div>
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title">HTTP Status Distribution</h2>
            <div class="chart-wrapper">
                <div id="status_div" role="img" aria-label="Bar chart showing distribution of HTTP status codes"></div>
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title">Error Analysis</h2>
            <div class="chart-wrapper">
                <div id="error_div" role="img" aria-label="Bar chart showing distribution of error types"></div>
            </div>
        </div>
    </div>
</body>
</html>
