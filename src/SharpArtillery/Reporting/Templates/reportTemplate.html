    <style>
        /* Phase 2.1: Responsive Container Layout */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            padding: 24px;
            color: #1e293b;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .section {
            margin-bottom: 48px;
        }

        /* Phase 2.5: Section Titles */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }

        .chart-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        /* Chart.js fills its box; the box sets the height. */
        .chart-box {
            position: relative;
            width: 100%;
        }

        .chart-main { height: 500px; }
        .chart-status { height: 320px; }
        .chart-errors { height: 420px; }

        /* Phase 2.4: Two-Column Layout */
        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        @media (max-width: 1024px) {
            .two-column { grid-template-columns: 1fr; }
            .container { padding: 24px; }
        }

        @media (max-width: 768px) {
            body { padding: 12px; }
            .section-title { font-size: 16px; }
            .chart-main { height: 360px; }
        }

        /* Phase 2.3: Report Header */
        .report-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .report-header .endpoint {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 24px;
            font-family: "SF Mono", "Fira Code", Consolas, monospace;
            word-break: break-all;
        }

        .report-meta {
            display: flex;
            gap: 32px;
            padding: 16px 24px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 32px;
            font-size: 14px;
            color: #475569;
            flex-wrap: wrap;
        }

        .report-meta strong {
            color: #1e293b;
        }

        @media (max-width: 768px) {
            .report-meta { flex-direction: column; gap: 8px; }
        }

        /* Phase 2.2: KPI Summary Cards */
        .kpi-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .kpi-card {
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            color: white;
        }

        /* Phase 3.1: Custom Color Palette */
        .kpi-rps { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .kpi-latency { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .kpi-errors { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .kpi-requests { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }

        .kpi-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: "SF Mono", "Fira Code", Consolas, monospace;
        }

        .kpi-label {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Phase 1.1: Empty Error State */
        .empty-state {
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            border-radius: 12px;
            border: 2px dashed #86efac;
        }

        .empty-state-content {
            text-align: center;
        }

        .empty-state h3 {
            color: #166534;
            margin: 16px 0 8px;
            font-size: 20px;
            font-weight: 600;
        }

        .empty-state p {
            color: #4ade80;
            margin: 0;
            font-size: 14px;
        }

        /* Phase 3.2: Improved Table Styling */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .report-table {
            font-family: inherit;
            border-collapse: collapse;
            width: 100%;
        }

        .report-table th {
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            border-bottom: 2px solid #e2e8f0;
            text-align: left;
        }

        .report-table td {
            padding: 12px 16px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 14px;
        }

        .report-table .num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .report-table tr:hover td {
            background: #f8fafc;
        }

        /* Phase 3.3: Print Stylesheet */
        @media print {
            body {
                background: white;
                padding: 0;
            }

            .container {
                box-shadow: none;
                padding: 20px;
            }

            .kpi-card {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .chart-wrapper {
                page-break-inside: avoid;
            }

            .section {
                page-break-inside: avoid;
            }
        }
    </style>
    <script type="text/javascript">
        // Phase 3.1: Custom Color Palette
        const CHART_COLORS = {
            latency: '#8b5cf6',    // Purple - primary metric
            rps: '#06b6d4',        // Cyan - throughput
            error: '#ef4444',      // Red - errors
            success: '#10b981',    // Green - success
            warning: '#f59e0b',    // Amber - warnings
            neutral: '#64748b'     // Slate - secondary
        };

        Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        Chart.defaults.color = '#475569';
        // A run can have thousands of seconds; drawing the final state at once keeps opening fast.
        Chart.defaults.animation = false;
        Chart.defaults.maintainAspectRatio = false;

        document.addEventListener('DOMContentLoaded', drawAll);

        const groupBy = function (xs, key) {
            return xs.reduce(function (rv, x) {
                (rv[x[key]] = rv[x[key]] || []).push(x);
                return rv;
            }, {});
        };

        const readJson = (id) => JSON.parse(document.getElementById(id).textContent);

        // Builds a table with textContent only, so an endpoint or error text is never read as HTML.
        // A column is { title, numeric }; a number cell is shown with the reader's digit grouping.
        function renderTable(containerId, columns, rows) {
            const table = document.createElement('table');
            table.className = 'report-table';

            const headRow = table.createTHead().insertRow();
            for (const column of columns) {
                const th = document.createElement('th');
                th.textContent = column.title;
                if (column.numeric) th.className = 'num';
                headRow.appendChild(th);
            }

            const body = table.createTBody();
            for (const row of rows) {
                const tr = body.insertRow();
                row.forEach((value, i) => {
                    const td = tr.insertCell();
                    td.textContent = typeof value === 'number' ? value.toLocaleString() : String(value);
                    if (columns[i].numeric) td.className = 'num';
                });
            }

            const wrapper = document.createElement('div');
            wrapper.className = 'table-wrapper';
            wrapper.appendChild(table);
            document.getElementById(containerId).replaceChildren(wrapper);
        }

        // Phase 2.3: Report Header with Metadata
        function drawReportMeta() {
            const s = readJson('summary');
            document.getElementById('report-endpoint').textContent = s.endpoint || '-';
            document.getElementById('report-timestamp').textContent = new Date().toLocaleString();
            document.getElementById('report-duration').textContent = s.durationSeconds.toFixed(1) + 's';
        }

        // Phase 2.2: KPI Summary Cards
        function drawSummaryCards() {
            const s = readJson('summary');
            document.getElementById('kpi-rps').textContent = s.averageRps.toFixed(1);
            document.getElementById('kpi-p95').textContent = s.p95LatencyMs.toFixed(1) + ' ms';
            document.getElementById('kpi-errors').textContent = (s.errorRatio * 100).toFixed(2) + '%';
            document.getElementById('kpi-requests').textContent = s.requests.toLocaleString();
        }

        function drawSummaryTable() {
            const s = readJson('summary');
            const pct = (x) => (x * 100).toFixed(2) + '%';
            const ms = (x) => (x).toFixed(2) + ' ms';

            renderTable('summary_div', [{ title: 'Metric' }, { title: 'Value' }], [
                ['Endpoint', String(s.endpoint)],
                ['Duration', (s.durationSeconds).toFixed(2) + ' s'],
                ['Requests', String(s.requests)],
                ['OK', String(s.ok)],
                ['Errors', String(s.errors)],
                ['Error ratio', pct(s.errorRatio)],
                ['Timeouts', String(s.timeouts)],
                ['2xx', String(s.status2xx)],
                ['3xx', String(s.status3xx)],
                ['4xx', String(s.status4xx)],
                ['5xx', String(s.status5xx)],
                ['Responses w/ length', String(s.knownResponseLengthCount)],
                ['Mean response length', (s.meanResponseLengthBytes).toFixed(0) + ' bytes'],
                ['Max response length', (s.maxResponseLengthBytes).toFixed(0) + ' bytes'],
                ['Average RPS', (s.averageRps).toFixed(1)],
                ['Mean latency', ms(s.meanLatencyMs)],
                ['Max latency', ms(s.maxLatencyMs)],
                ['p50 latency', ms(s.p50LatencyMs)],
                ['p90 latency', ms(s.p90LatencyMs)],
                ['p95 latency', ms(s.p95LatencyMs)],
                ['p99 latency', ms(s.p99LatencyMs)]
            ]);
        }

        function drawPhaseTable() {
            const s = readJson('summary');
            const phases = s.phaseBreakdown ?? [];

            // If no phase data, fall back to time-series grouping
            if (phases.length === 0) {
                drawPhaseTableFromTimeSeries();
                return;
            }

            const pct = (x) => (x * 100);
            const numeric = (title) => ({ title, numeric: true });

            renderTable('phase_div', [
                { title: 'Phase' },
                numeric('Requests'),
                numeric('Duration (s)'),
                numeric('Avg RPS'),
                numeric('Mean Latency (ms)'),
                numeric('p50 (ms)'),
                numeric('p95 (ms)'),
                numeric('p99 (ms)'),
                numeric('Error %')
            ], phases.map(p => [
                p.phase,
                p.requests,
                Math.round(p.durationSeconds * 10) / 10,
                Math.round(p.averageRps),
                Math.round(p.meanLatencyMs * 100) / 100,
                Math.round(p.p50LatencyMs * 100) / 100,
                Math.round(p.p95LatencyMs * 100) / 100,
                Math.round(p.p99LatencyMs * 100) / 100,
                Math.round(pct(p.errorRatio) * 100) / 100
            ]));
        }

        function drawPhaseTableFromTimeSeries() {
            let dataRows = readJson('data');
            let groupedByPhase = groupBy(dataRows, 'phase');

            const avg = (arr, key) => arr.reduce((p, c) => p + c[key], 0) / arr.length;
            let rows = [];
            for (const phase in groupedByPhase) {
                const items = groupedByPhase[phase];
                rows.push([
                    phase,
                    avg(items, 'meanLatencyMs'),
                    avg(items, 'rps'),
                    avg(items, 'errorRatio')
                ]);
            }

            renderTable('phase_div', [
                { title: 'Phase' },
                { title: 'Mean latency (ms)', numeric: true },
                { title: 'Mean RPS', numeric: true },
                { title: 'Error ratio', numeric: true }
            ], rows);
        }

        function drawStatusHistogramTable() {
            const s = readJson('summary');
            const items = s.statusHistogram ?? [];

            new Chart(document.getElementById('status_chart'), {
                type: 'bar',
                data: {
                    labels: items.map(o => String(o.statusCode)),
                    datasets: [{
                        label: 'Count',
                        data: items.map(o => Number(o.count)),
                        backgroundColor: CHART_COLORS.success
                    }]
                },
                options: {
                    plugins: {
                        title: { display: true, text: 'Status code distribution' },
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const o = items[ctx.dataIndex];
                                    return `${o.statusCode}: ${o.count} (${(Number(o.ratio) * 100).toFixed(2)}%)`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'HTTP status' } },
                        y: { title: { display: true, text: 'Count' }, beginAtZero: true }
                    }
                }
            });
        }

        // Phase 1.1: Empty Error Chart State Handler
        function drawErrorHistogramTable() {
            const s = readJson('summary');
            const items = s.errorHistogram ?? [];

            // Handle empty state with friendly message
            if (items.length === 0) {
                const emptyDiv = document.getElementById('error_div');
                emptyDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-content">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            <h3>No Errors Detected</h3>
                            <p>All ${Number(s.requests)} requests completed successfully</p>
                        </div>
                    </div>
                `;
                return;
            }

            // Keep the chart readable by limiting to the top N error groups.
            const topN = 12;
            const topItems = items.slice(0, topN);

            new Chart(document.getElementById('error_chart'), {
                type: 'bar',
                data: {
                    labels: topItems.map(o => String(o.error)),
                    datasets: [{
                        label: 'Count',
                        data: topItems.map(o => Number(o.count)),
                        backgroundColor: CHART_COLORS.error
                    }]
                },
                options: {
                    indexAxis: 'y',
                    plugins: {
                        title: { display: true, text: 'Top error types' },
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => {
                                    const o = topItems[ctx.dataIndex];
                                    return `${o.error}: ${o.count} (${(Number(o.ratio) * 100).toFixed(2)}% of errors)`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: { title: { display: true, text: 'Count' }, beginAtZero: true }
                    }
                }
            });
        }

        function drawMainChart() {
            const s = readJson('summary');
            let rows = readJson('data');

            const maxErrorRatio = rows.reduce((p, c) => Math.max(p, c['errorRatio'] ?? 0), 0);
            const errorAxisMax = Math.max(0.02, maxErrorRatio * 1.2);
            const errorAxisMin = -errorAxisMax * 0.1;

            const maxTime = rows.reduce((p, c) => Math.max(p, c['time'] ?? 0), 0);
            const timeAxisMax = Math.max(1, maxTime);

            // Phase 1.2: P95-based latency axis scaling
            const allLatencies = rows.map(r => r['meanLatencyMs']).filter(l => l > 0).sort((a,b) => a-b);
            const p95Latency = allLatencies.length > 0
                ? allLatencies[Math.floor(allLatencies.length * 0.95)]
                : 100;
            const latencyAxisMax = Math.ceil(p95Latency * 1.5); // 50% headroom above p95

            const points = (key) => rows.map(o => ({ x: o['time'], y: o[key] }));

            // Phase 1.3 & 1.4: Reduce gridline density and keep the right-hand axes apart
            new Chart(document.getElementById('main_chart'), {
                data: {
                    datasets: [
                        {
                            type: 'line',
                            label: 'Mean latency (ms)',
                            data: points('meanLatencyMs'),
                            yAxisID: 'latency',
                            borderColor: CHART_COLORS.latency,
                            backgroundColor: CHART_COLORS.latency,
                            borderWidth: 2,
                            pointRadius: 0,
                            order: 1
                        },
                        {
                            type: 'bar',
                            label: 'RPS',
                            data: points('rps'),
                            yAxisID: 'rps',
                            backgroundColor: CHART_COLORS.rps + '99',
                            order: 2
                        },
                        {
                            type: 'line',
                            label: 'Error ratio',
                            data: points('errorRatio'),
                            yAxisID: 'errors',
                            borderColor: CHART_COLORS.error,
                            backgroundColor: CHART_COLORS.error,
                            borderWidth: 3,
                            pointRadius: 4,
                            order: 0
                        }
                    ]
                },
                options: {
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        title: { display: true, text: 'Latency, RPS, and errors over time' },
                        subtitle: { display: true, text: String(s.endpoint) },
                        tooltip: {
                            callbacks: {
                                title: (items) => items.length > 0 ? `${items[0].parsed.x} s` : '',
                                label: (ctx) => ctx.dataset.yAxisID === 'errors'
                                    ? `${ctx.dataset.label}: ${(ctx.parsed.y * 100).toFixed(2)}%`
                                    : `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: 0,
                            max: timeAxisMax,
                            title: { display: true, text: 'Time (s)' },
                            ticks: { maxTicksLimit: 11, precision: 0 }  // Phase 1.3
                        },
                        latency: {
                            type: 'linear',
                            position: 'left',
                            min: 0,
                            max: latencyAxisMax,  // Phase 1.2
                            title: { display: true, text: 'Latency (ms)' },
                            ticks: { maxTicksLimit: 6 }  // Phase 1.3
                        },
                        rps: {
                            type: 'linear',
                            position: 'right',
                            beginAtZero: true,
                            title: { display: true, text: 'RPS' },
                            grid: { drawOnChartArea: false }  // Phase 1.3
                        },
                        errors: {
                            type: 'linear',
                            position: 'right',
                            min: errorAxisMin,
                            max: errorAxisMax,
                            title: { display: true, text: 'Error %' },  // Phase 1.4
                            ticks: {
                                font: { size: 11 },
                                callback: (value) => (value * 100).toFixed(1) + '%'
                            },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        function drawAll() {
            drawReportMeta();
            drawSummaryCards();
            drawMainChart();
            drawSummaryTable();
            drawPhaseTable();
            drawStatusHistogramTable();
            drawErrorHistogramTable();
        }
    </script>
</head>
<body>
    <div class="container">
        <!-- Phase 2.3: Report Header -->
        <div class="report-header">
            <h1>Load Test Report</h1>
            <p class="endpoint" id="report-endpoint">-</p>
        </div>

        <div class="report-meta">
            <div><strong>Generated:</strong> <span id="report-timestamp">-</span></div>
            <div><strong>Duration:</strong> <span id="report-duration">-</span></div>
            <div><strong>Tool:</strong> Sharptillery</div>
        </div>

        <!-- Phase 2.2: KPI Cards -->
        <div class="kpi-cards">
            <div class="kpi-card kpi-rps">
                <div class="kpi-value" id="kpi-rps">-</div>
                <div class="kpi-label">Avg RPS</div>
            </div>
            <div class="kpi-card kpi-latency">
                <div class="kpi-value" id="kpi-p95">-</div>
                <div class="kpi-label">p95 Latency</div>
            </div>
            <div class="kpi-card kpi-errors">
                <div class="kpi-value" id="kpi-errors">-</div>
                <div class="kpi-label">Error Rate</div>
            </div>
            <div class="kpi-card kpi-requests">
                <div class="kpi-value" id="kpi-requests">-</div>
                <div class="kpi-label">Total Requests</div>
            </div>
        </div>

        <!-- Phase 2.5: Section with Title -->
        <div class="section">
            <h2 class="section-title">Performance Over Time</h2>
            <div class="chart-wrapper">
                <div class="chart-box chart-main" id="linechart_material">
                    <canvas id="main_chart" role="img" aria-label="Time series chart showing mean latency, requests per second, and error rate over the test duration"></canvas>
                </div>
            </div>
        </div>

        <!-- Phase 2.4: Two-Column Layout -->
        <div class="section two-column">
            <div>
                <h2 class="section-title">Summary Statistics</h2>
                <div id="summary_div"></div>
            </div>
            <div>
                <h2 class="section-title">Phase Breakdown</h2>
                <div id="phase_div"></div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">HTTP Status Distribution</h2>
            <div class="chart-wrapper">
                <div class="chart-box chart-status" id="status_div">
                    <canvas id="status_chart" role="img" aria-label="Bar chart showing distribution of HTTP status codes"></canvas>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title">Error Analysis</h2>
            <div class="chart-wrapper">
                <div class="chart-box chart-errors" id="error_div">
                    <canvas id="error_chart" role="img" aria-label="Bar chart showing distribution of error types"></canvas>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
